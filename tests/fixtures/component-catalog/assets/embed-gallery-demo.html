<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>样本量估算</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { margin: 0; padding: 20px 24px; background: light-dark(#fff, #191919); color: light-dark(#2c2c2b, #f0efed); }
  h1 { margin: 0 0 12px; font-size: 17px; }
  label { display: block; margin: 12px 0 4px; color: light-dark(#7d7a75, #ada9a3); font-size: 13px; }
  input { width: 100%; }
  output { font-size: 28px; font-weight: 600; }
  p { margin: 16px 0 0; }
</style>
</head>
<body>
<h1>样本量估算</h1>
<label for="margin">允许的误差：<span id="marginText">3</span>%</label>
<input id="margin" type="range" min="1" max="10" value="3">
<p>95% 置信水平下大约需要 <output id="count"></output> 个样本。</p>
<script>
  const margin = document.getElementById("margin");
  const update = () => {
    const e = Number(margin.value) / 100;
    document.getElementById("marginText").textContent = margin.value;
    document.getElementById("count").textContent = Math.ceil((1.96 * 1.96 * 0.25) / (e * e)).toLocaleString("zh-CN");
  };
  margin.addEventListener("input", update);
  update();
</script>
</body>
</html>
