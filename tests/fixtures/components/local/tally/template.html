<!-- A new tally: the words a reader changes, a field its label names and what the component draws in. -->
<div class="tally" data-doc-component="local/tally">
  <h3>新的计数</h3>
  <p class="tally-caption">写上计的是什么</p>
  <label for="tally-note">备注 <input id="tally-note" type="text" class="tally-filter"></label>
  <button type="button" class="tally-refresh">刷新</button>
  <output class="tally-drawn" id="tally-drawn"></output>
</div>
